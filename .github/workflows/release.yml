name: Build desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: App
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        working-directory: App
        run: python -m unittest discover -s tests -v

      - name: Build executable
        working-directory: App
        run: python -m PyInstaller --noconfirm --clean --distpath outputs --workpath build RebRed-1.1-beta.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: rebred-windows-x86_64
          path: App/outputs/RebRed-1.1-beta.exe
          if-no-files-found: error

  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse libfuse2 python3-pip python3-tk python3-venv xvfb

      - name: Set up Python environment
        working-directory: App
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        working-directory: App
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build Linux executable
        working-directory: App
        run: .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name RebRed --distpath build/linux --workpath build/linux-work app.py

      - name: Package AppImage
        working-directory: App
        shell: bash
        run: |
          set -euo pipefail
          appdir="$PWD/build/RebRed.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/scalable/apps"
          mkdir -p outputs
          install -m 755 build/linux/RebRed "$appdir/usr/bin/RebRed"
          install -m 644 rebred.svg "$appdir/usr/share/icons/hicolor/scalable/apps/rebred.svg"
          cat > "$appdir/usr/share/applications/rebred.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RebRed
          Comment=Prepare Reddit art commission posts locally
          Exec=RebRed
          Icon=rebred
          Terminal=false
          Categories=Graphics;Utility;
          EOF
          wget --quiet --show-progress \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output-document linuxdeploy-x86_64.AppImage
          wget --quiet --show-progress \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            --output-document linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/RebRed" \
            --desktop-file "$appdir/usr/share/applications/rebred.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/scalable/apps/rebred.svg" \
            --output appimage
          mv RebRed-x86_64.AppImage outputs/RebRed-1.1-beta-x86_64.AppImage

      - name: Smoke-test AppImage
        working-directory: App
        shell: bash
        run: |
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum \
            timeout --signal=TERM 20s ./outputs-RebRed-1.1-beta-x86_64.AppImage
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "AppImage startup smoke test failed with exit code $result."
            exit 1
          fi

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: rebred-linux-x86_64
          path: App/outputs-RebRed-1.1-beta-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum RebRed-1.1-beta.exe RebRed-1.1-beta-x86_64.AppImage > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: RebRed ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/RebRed-1.1-beta.exe
            release-assets/RebRed-1.1-beta-x86_64.AppImage
            release-assets/SHA256SUMS.txt
