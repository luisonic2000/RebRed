name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: App
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        working-directory: App
        run: python -m unittest discover -s tests -v
      - name: Build clean executable
        working-directory: App
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RebRed --distpath outputs --workpath build --hidden-import win32com.shell.shell --hidden-import win32com.server.util app.py
      - name: Generate checksum
        shell: pwsh
        run: |
          $checksum = (Get-FileHash -LiteralPath App/outputs/RebRed.exe -Algorithm SHA256).Hash.ToLower()
          "$checksum  RebRed.exe" | Set-Content -LiteralPath App/outputs/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: rebred-windows
          path: |
            App/outputs/RebRed.exe
            App/outputs/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rebred-windows
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: RebRed ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/RebRed.exe
            release-assets/SHA256SUMS.txt
